    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navegación y Menú Desplegable */
        nav {
            background-color: #141824;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        .nav-item {
            position: relative;
        }

        .nav-btn {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #334155;
            color: #38bdf8;
        }

        /* Menú Desplegable (Dropdown) */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #1e293b;
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            padding: 8px 0;
            z-index: 1000;
            border: 1px solid #334155;
        }

        .dropdown-menu a {
            color: #cbd5e1;
            padding: 10px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .dropdown-menu a:hover {
            background-color: #334155;
            color: #ffffff;
        }

        .nav-item:hover .dropdown-menu {
            display: block;
        }

        /* Contenido Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .hero-logo {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            margin-bottom: 30px;
            object-fit: cover;
        }

        p.frequency {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* Iconos de Redes Sociales */
        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 1.4rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background-color: #d4af37;
            color: #0d0d0d;
            transform: translateY(-3px);
        }
    </style>
</head>
