    <!-- Script de Control del Audio -->
    <script>
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-btn');
        const audioIcon = document.getElementById('audio-icon');
        const audioText = document.getElementById('audio-text');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                audioIcon.className = "fa-solid fa-pause";
                audioText.textContent = "Pausar Música";
            } else {
                audio.pause();
                audioIcon.className = "fa-solid fa-play";
                audioText.textContent = "Reproducir Música";
            }
        }

        // Intento de reproducción automática en el primer clic del visitante
        document.addEventListener('click', function startAudioOnFirstClick() {
            if (audio.paused) {
                audio.play().then(() => {
                    audioIcon.className = "fa-solid fa-pause";
                    audioText.textContent = "Pausar Música";
                }).catch(e => {
                    console.log("Autoplay restringido por el navegador hasta interactuar directamente con el botón.");
                });
            }
            document.removeEventListener('click', startAudioOnFirstClick);
        }, { once: true });
    </script>
